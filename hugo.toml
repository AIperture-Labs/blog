baseURL = "https://aiperture-labs.github.io/blog/"
languageCode = "en-us"
title = "AetherEngine Dev Blog"
copyright = "AIperture Labs"
enableRobotsTXT = true

[params]
description = "Notes on designing and building AetherEngine, a modular C++23 game engine on Vulkan."
repo = "https://github.com/AIperture-Labs/AetherEngine"

[taxonomies]
tag = "tags"

[menus]
[[menus.main]]
name = "Posts"
pageRef = "/posts"
weight = 1
[[menus.main]]
name = "Tags"
pageRef = "/tags"
weight = 2
[[menus.main]]
name = "About"
pageRef = "/about"
weight = 3

[markup.highlight]
noClasses = false

[markup.tableOfContents]
startLevel = 2
endLevel = 3

[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
block = [["\\[", "\\]"], ["$$", "$$"]]
inline = [["\\(", "\\)"]]

[outputs]
home = ["HTML", "RSS"]
